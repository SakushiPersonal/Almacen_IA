name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t almacen-api .
      # Building is not enough: a bad uvicorn CMD only fails at runtime.
      # Start the container and wait until /health answers.
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://unused:unused@localhost/unused \
            almacen-api
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not answer /api/v1/health after 20s"
          docker logs api
          exit 1
