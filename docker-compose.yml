services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check if the database is ready to accept connections nd forcing to listen on localhost to not run pg_isready listening on Unix socket
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    
    # wait for the database to be healthy before starting the API service
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
